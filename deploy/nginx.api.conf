# Reference nginx server block for the VPS host (outside Docker).
# Copy to /etc/nginx/sites-available/api.interactive-school-map.shenid.ru,
# symlink into sites-enabled, then `certbot --nginx` if using Full (strict) SSL
# instead of Cloudflare Flexible mode.
server {
    listen 80;
    server_name api.interactive-school-map.shenid.ru;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
